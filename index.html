<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- installable app: the manifest (relative paths, so it works under /the-commish/), the iOS home screen icon and the iOS standalone metas.
         theme-color (below) follows the light or dark look; a web manifest cannot, so it carries the light colour. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="the commish" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)" />
    <!-- Before the first paint: the page background for the system setting, and the owner's stored override (src/app/theme.ts has the same
         key and colours; theme.test.ts runs this script against it). Without it a dark-mode owner sees a flash of parchment. -->
    <style>
      html { background: #f4f1eb; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #171512; } }
      html[data-theme="dark"] { background: #171512; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wr.theme.v1');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.setAttribute('data-theme', t);
          var c = t === 'dark' ? '#171512' : '#f4f1eb';
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
        } catch (e) {}
      })();
    </script>
    <title>the commish</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
